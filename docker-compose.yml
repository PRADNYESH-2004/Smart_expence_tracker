services:
  db:
    image: postgres:16
    container_name: expense_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - expense_data:/var/lib/postgresql/data
volumes:
  expense_data:
